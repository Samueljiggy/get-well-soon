<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Well Soon, [Her Name]</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <header>
        <h1>Get Well Soon, My babyyyy</h1>
      </header>
      
      <section class="message">
        <p>Whenever you feel down, remember you’re never alone. I’m always here for you.</p>
      </section>
      
      <section class="music">
        <h2>Listen to this Kendrick Lamar song to uplift yourself</h2>
        <!-- Spotify Embed (replace TRACK_ID_HERE with the actual track ID) -->
        <iframe 
          src="https://open.spotify.com/embed/track/3iVcZ5G6tvkXZkZKlMpIUs" 
          width="100%" 
          height="80" 
          frameborder="0" 
          allowtransparency="true" 
          allow="encrypted-media">
        </iframe>
      </section>
      
      <section class="interactive">
        <button id="click-btn">Click</button>
        <div id="gif-container" class="hidden">
          <img src="hug.gif" alt="Sending Virtual Hugs" />
        <p>Sending Virtual Hugs</p></div>
      </section>
      
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
